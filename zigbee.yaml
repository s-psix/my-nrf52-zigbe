esphome:
  name: nrf52-zigbee-combo
  on_boot:
    priority: 800
    then:
      - output.turn_on: vcc_power

nrf52:
  board: adafruit_itsybitsy_nrf52840
  bootloader: adafruit_nrf52_sd140_v6

zigbee:

# Включаем питание 3.3 В на выходе VCC гребёнки платы (особенность nice!nano)
output:
  - platform: gpio
    id: vcc_power
    pin: P0.13

# --- 4 ВЫХОДА (Реле / Лампочки / Нагрузка) ---
switch:
  - platform: gpio
    name: "Выход 1 (Синий LED)"
    pin: P0.15
  - platform: gpio
    name: "Выход 2 (Пин 006)"
    pin: P0.06
  - platform: gpio
    name: "Выход 3 (Пин 008)"
    pin: P0.08
  - platform: gpio
    name: "Выход 4 (Пин 017)"
    pin: P0.17

# --- 4 ВХОДА (Кнопки / Герконы / Датчики открытия) ---
binary_sensor:
  - platform: gpio
    name: "Вход 1 (Пин 111)"
    pin:
      number: P1.11
      mode: { input: true, pullup: true }
      inverted: true
  - platform: gpio
    name: "Вход 2 (Пин 113)"
    pin:
      number: P1.13
      mode: { input: true, pullup: true }
      inverted: true
  - platform: gpio
    name: "Вход 3 (Пин 115)"
    pin:
      number: P1.15
      mode: { input: true, pullup: true }
      inverted: true
  - platform: gpio
    name: "Вход 4 (Пин 106)"
    pin:
      number: P1.06
      mode: { input: true, pullup: true }
      inverted: true

# --- 2 АНАЛОГОВЫХ ДАТЧИКА (АЦП) ---
sensor:
  - platform: adc
    name: "АЦП 1 (Пин 002)"
    pin: P0.02
    update_interval: 30s
  - platform: adc
    name: "АЦП 2 (Пин 029)"
    pin: P0.29
    update_interval: 30s
