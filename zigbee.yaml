esphome:
  name: nrf52-zigbee-combo

nrf52:
  board: nice_nano_v2
  bootloader: adafruit_nrf52_sd140_v6

# Встроенный официальный компонент Zigbee (ESPHome 2026)
zigbee:

# 1. РЕЛЕ / ЛАМПОЧКА (встроенный синий светодиод P0.15 — управляется голосом через Алису)
switch:
  - platform: gpio
    name: "Тестовая лампа"
    pin: P0.15

# 2. ПЕРЕКЛЮЧАТЕЛЬ / КНОПКА (замыкание пина 111 / P1.11 на GND)
binary_sensor:
  - platform: gpio
    name: "Кнопка на плате"
    pin:
      number: P1.11
      mode:
        input: true
        pullup: true
      inverted: true

# 3. ДАТЧИК (аналоговый АЦП на пине 002 / P0.02)
sensor:
  - platform: adc
    name: "Аналоговый датчик"
    pin: P0.02
    update_interval: 30s
