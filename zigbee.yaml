esphome:
  name: nrf52-zigbee-combo

external_components:
  - source: github://tomaszduda23/esphome@nrf52_zigbee
    components: [zigbee]

nrf52:
  board: nice_nano_v2
  bootloader: adafruit_nrf52_sd140_v6

zigbee:
  id: zb

# 1. ЛАМПОЧКА (встроенный синий светодиод P0.15)
output:
  - platform: gpio
    id: led_out
    pin: P0.15

light:
  - platform: binary
    name: "Тестовая лампа"
    output: led_out

# 2. ПЕРЕКЛЮЧАТЕЛЬ / КНОПКА (замыкание P0.11 на GND)
binary_sensor:
  - platform: gpio
    name: "Кнопка на плате"
    pin:
      number: P1.11
      mode: INPUT_PULLUP
      inverted: true

# 3. ДАТЧИК (аналоговый АЦП на P0.02)
sensor:
  - platform: adc
    name: "Аналоговый датчик"
    pin: P0.02
    update_interval: 30s
