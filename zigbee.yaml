esphome:
  name: nrf52-zigbee-combo
  on_boot:
    priority: 800
    then:
      - output.turn_on: vcc_power

nrf52:
  board: adafruit_itsybitsy_nrf52840
  bootloader: adafruit_nrf52_sd140_v6

zigbee:
  router: true

# Включаем питание 3.3 В на выходе VCC гребёнки платы (не считается за Zigbee endpoint)
output:
  - platform: gpio
    id: vcc_power
    pin: P0.13

# --- 3 ВЫХОДА (Реле / Лампочки) ---
switch:
  - platform: gpio
    name: "Out1_LED"
    pin: P0.15
  - platform: gpio
    name: "Out2_P006"
    pin: P0.06
  - platform: gpio
    name: "Out3_P008"
    pin: P0.08

# --- 3 ВХОДА (Кнопки / Герконы / Переключатели) ---
binary_sensor:
  - platform: gpio
    name: "In1_P111"
    pin:
      number: P1.11
      mode: { input: true, pullup: true }
      inverted: true
  - platform: gpio
    name: "In2_P113"
    pin:
      number: P1.13
      mode: { input: true, pullup: true }
      inverted: true
  - platform: gpio
    name: "In3_P115"
    pin:
      number: P1.15
      mode: { input: true, pullup: true }
      inverted: true

# --- 2 АНАЛОГОВЫХ ДАТЧИКА (АЦП) ---
sensor:
  - platform: adc
    name: "ADC1_P002"
    pin: P0.02
    update_interval: 30s
  - platform: adc
    name: "ADC2_P029"
    pin: P0.29
    update_interval: 30s
